<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>idMe 教师极速点名工作台</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .touch-btn { touch-action: manipulation; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-28">

  <!-- 顶部导航栏 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <div class="flex items-center space-x-2">
          <span class="bg-blue-600 text-white text-xs font-bold px-2 py-0.5 rounded">idMe / MOEIS</span>
          <h1 id="className" class="font-bold text-slate-900 text-base md:text-lg">加载班级中...</h1>
        </div>
        <p class="text-xs text-slate-500 mt-0.5" id="schoolSubtitle">Sistem Pengurusan Sekolah</p>
      </div>
      <div class="flex items-center space-x-2">
        <input type="date" id="datePicker" class="text-xs border border-slate-300 rounded px-2 py-1.5 bg-slate-50 text-slate-700 font-medium outline-none focus:ring-2 focus:ring-blue-500">
        <button id="refreshBtn" class="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded border border-slate-300 text-xs font-medium">刷新</button>
      </div>
    </div>
  </header>

  <!-- 主控制卡片 -->
  <main class="max-w-4xl mx-auto px-4 pt-4">

    <!-- 快捷操作大横幅 -->
    <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm mb-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <div class="flex items-center space-x-2">
            <span class="text-sm font-semibold text-slate-700">出勤统计:</span>
            <span class="text-xs px-2 py-0.5 rounded-full font-bold bg-emerald-100 text-emerald-800" id="statHadir">出席 0</span>
            <span class="text-xs px-2 py-0.5 rounded-full font-bold bg-rose-100 text-rose-800" id="statTidakHadir">缺席 0</span>
            <span class="text-xs px-2 py-0.5 rounded-full font-bold bg-slate-100 text-slate-700" id="statTotal">总数 0</span>
          </div>
          <p class="text-xs text-slate-500 mt-1" id="statusMessage">正在同步教育部系统状态...</p>
        </div>

        <div class="flex items-center space-x-2">
          <!-- 一键全勤主按钮 -->
          <button id="allPresentBtn" class="flex-1 sm:flex-none px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-sm text-sm flex items-center justify-center space-x-1.5 active:scale-95 transition-all">
            <span>[一键全勤提交]</span>
          </button>
          <!-- 重置按钮 -->
          <button id="resetBtn" class="px-3 py-2.5 bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 border border-slate-300 hover:border-rose-300 font-medium rounded-lg text-xs transition-all">
            重置
          </button>
        </div>
      </div>
    </div>

    <!-- 学生网格列表 -->
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">学生出勤花名册 (点击卡片切换出席/缺席)</h2>
      <span class="text-xs text-slate-400">绿色为出席，红色为缺席</span>
    </div>

    <div id="studentGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5">
      <!-- 动态填充学生卡片 -->
      <div class="col-span-full py-12 text-center text-slate-400 text-sm">正在加载全班学生名单...</div>
    </div>

  </main>

  <!-- 底部吸底提交栏 -->
  <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-slate-200 p-3 z-20 shadow-lg">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
      <div class="text-xs text-slate-600">
        <div>出勤: <strong class="text-emerald-600 font-bold" id="bottomHadir">0</strong> 出席 / <strong class="text-rose-600 font-bold" id="bottomTidakHadir">0</strong> 缺席</div>
        <div class="text-slate-400 text-[11px]" id="bottomNotice">如有缺席请点击学生卡片选择原因</div>
      </div>
      <button id="submitBtn" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow text-sm active:scale-95 transition-all">
        确认提交并归档
      </button>
    </div>
  </div>

  <!-- 缺勤原因选择弹窗 (Bottom Sheet / Modal) -->
  <div id="reasonModal" class="fixed inset-0 bg-black/40 z-50 flex items-end sm:items-center justify-center hidden">
    <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 max-h-[85vh] overflow-y-auto shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div>
          <h3 class="font-bold text-slate-900 text-base" id="modalStudentName">选择缺勤原因</h3>
          <p class="text-xs text-slate-500">将标记该学生为缺席 (Tidak Hadir)</p>
        </div>
        <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 text-lg p-1">&times;</button>
      </div>

      <div class="py-3 space-y-2" id="reasonsContainer">
        <!-- 常用原因按钮 -->
      </div>

      <div class="pt-2 border-t border-slate-100 flex items-center justify-end space-x-2">
        <button id="cancelAbsentBtn" class="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded">取消 (恢复出席)</button>
      </div>
    </div>
  </div>

  <!-- 登录凭据弹窗 -->
  <div id="loginModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white w-full max-w-sm rounded-xl p-6 shadow-2xl">
      <h3 class="font-bold text-slate-900 text-lg mb-1">登录 idMe 教育部门户</h3>
      <p class="text-xs text-slate-500 mb-4">请输入您的教师身份证号与密码以接管点名</p>
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">身份证号 / No. KP</label>
          <input type="text" id="loginIc" class="w-full text-sm border border-slate-300 rounded px-3 py-2 outline-none focus:border-blue-500" placeholder="例如: 900101015523">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">密码 / Kata Laluan</label>
          <input type="password" id="loginPw" class="w-full text-sm border border-slate-300 rounded px-3 py-2 outline-none focus:border-blue-500" placeholder="请输入密码">
        </div>
        <div id="loginError" class="text-xs text-rose-600 hidden font-medium"></div>
        <button id="doLoginBtn" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg text-sm transition-all mt-2">
          立即连接登录
        </button>
      </div>
    </div>
  </div>

  <script>
    let currentClass = null;
    let studentList = [];
    let commonReasons = [];
    let activeTargetStudent = null;

    // 初始化日期控件
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    document.getElementById('datePicker').value = `${yyyy}-${mm}-${dd}`;

    function getFormattedDate() {
      const parts = document.getElementById('datePicker').value.split('-');
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    async function initApp() {
      try {
        const res = await fetch('/api/init', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({})
        });
        const data = await res.json();
        if (!data.success) {
          showLoginModal();
          return;
        }
        loadAttendance();
      } catch (e) {
        showLoginModal();
      }
    }

    function showLoginModal() {
      document.getElementById('loginModal').classList.remove('hidden');
    }

    document.getElementById('doLoginBtn').onclick = async () => {
      const ic = document.getElementById('loginIc').value.trim();
      const pw = document.getElementById('loginPw').value.trim();
      const errBox = document.getElementById('loginError');
      errBox.classList.add('hidden');

      if (!ic || !pw) {
        errBox.textContent = '请输入完整的身份证号与密码';
        errBox.classList.remove('hidden');
        return;
      }

      document.getElementById('doLoginBtn').textContent = '正在连接教育部网关...';
      document.getElementById('doLoginBtn').disabled = true;

      try {
        const res = await fetch('/api/init', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ ic, password: pw })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('loginModal').classList.add('hidden');
          loadAttendance();
        } else {
          errBox.textContent = data.error || '登录失败，请检查密码';
          errBox.classList.remove('hidden');
        }
      } catch (e) {
        errBox.textContent = '网络连接异常: ' + e;
        errBox.classList.remove('hidden');
      } finally {
        document.getElementById('doLoginBtn').textContent = '立即连接登录';
        document.getElementById('doLoginBtn').disabled = false;
      }
    };

    async function loadAttendance() {
      const dateStr = getFormattedDate();
      document.getElementById('statusMessage').textContent = '正在获取出勤数据...';
      try {
        const res = await fetch(`/api/attendance?date=${encodeURIComponent(dateStr)}`);
        const data = await res.json();
        if (!data.success) {
          alert('获取出勤数据失败: ' + data.error);
          return;
        }

        currentClass = data.class;
        commonReasons = data.reasons;
        document.getElementById('className').textContent = currentClass.name || '负责班级';
        
        studentList = data.attendance.students.map(s => ({
          ...s,
          selectedReason: null
        }));

        renderGrid();
        updateCounters();
        document.getElementById('statusMessage').textContent = `数据已同步 (状态: ${data.attendance.statushari === 0 ? '正常上课日' : '非上课日'})`;
      } catch (e) {
        alert('加载失败: ' + e);
      }
    }

    function renderGrid() {
      const grid = document.getElementById('studentGrid');
      grid.innerHTML = '';

      studentList.forEach(st => {
        const card = document.createElement('div');
        card.className = `p-3.5 rounded-xl border transition-all cursor-pointer flex items-center justify-between ${
          st.is_present 
            ? 'bg-white border-slate-200 hover:border-emerald-400 hover:shadow-sm' 
            : 'bg-rose-50 border-rose-200 shadow-sm'
        }`;

        const genderTag = st.gender === 'L' 
          ? '<span class="text-[10px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded font-bold">男</span>' 
          : '<span class="text-[10px] bg-pink-100 text-pink-700 px-1.5 py-0.5 rounded font-bold">女</span>';

        const reasonBadge = !st.is_present && st.selectedReason 
          ? `<div class="text-[11px] text-rose-700 font-medium mt-1 truncate max-w-[180px]">原因: ${st.selectedReason.keterangan}</div>` 
          : '';

        card.innerHTML = `
          <div class="flex items-center space-x-3 overflow-hidden">
            <span class="w-6 text-center text-xs font-bold text-slate-400">${st.index}</span>
            <div class="truncate">
              <div class="flex items-center space-x-1.5">
                <span class="font-bold text-sm text-slate-800 truncate">${st.name}</span>
                ${genderTag}
              </div>
              ${reasonBadge}
            </div>
          </div>
          <div>
            ${st.is_present 
              ? '<span class="px-2.5 py-1 bg-emerald-100 text-emerald-700 text-xs font-bold rounded-lg">[出席]</span>'
              : '<span class="px-2.5 py-1 bg-rose-500 text-white text-xs font-bold rounded-lg">[缺席]</span>'}
          </div>
        `;

        card.onclick = () => toggleStudent(st);
        grid.appendChild(card);
      });
    }

    function toggleStudent(st) {
      if (st.is_present) {
        // 从出席切为缺席 -> 弹窗选择假因
        openReasonModal(st);
      } else {
        // 从缺席恢复出席
        st.is_present = true;
        st.selectedReason = null;
        renderGrid();
        updateCounters();
      }
    }

    function openReasonModal(st) {
      activeTargetStudent = st;
      document.getElementById('modalStudentName').textContent = `${st.index}. ${st.name}`;
      const container = document.getElementById('reasonsContainer');
      container.innerHTML = '';

      commonReasons.forEach((r, idx) => {
        const btn = document.createElement('button');
        btn.className = 'w-full text-left p-3 rounded-lg border border-slate-200 hover:border-blue-500 hover:bg-blue-50/50 text-xs font-medium transition-all flex items-center justify-between';
        btn.innerHTML = `
          <span>${idx + 1}. ${r.keterangan}</span>
          <span class="text-[10px] text-slate-400">${r.kategori}</span>
        `;
        btn.onclick = () => {
          st.is_present = false;
          st.selectedReason = r;
          closeReasonModal();
          renderGrid();
          updateCounters();
        };
        container.appendChild(btn);
      });

      document.getElementById('reasonModal').classList.remove('hidden');
    }

    function closeReasonModal() {
      document.getElementById('reasonModal').classList.add('hidden');
      activeTargetStudent = null;
    }

    document.getElementById('closeModalBtn').onclick = closeReasonModal;
    document.getElementById('cancelAbsentBtn').onclick = () => {
      if (activeTargetStudent) {
        activeTargetStudent.is_present = true;
        activeTargetStudent.selectedReason = null;
        renderGrid();
        updateCounters();
      }
      closeReasonModal();
    };

    function updateCounters() {
      const total = studentList.length;
      const hadir = studentList.filter(s => s.is_present).length;
      const tidakHadir = total - hadir;

      document.getElementById('statHadir').textContent = `出席 ${hadir}`;
      document.getElementById('statTidakHadir').textContent = `缺席 ${tidakHadir}`;
      document.getElementById('statTotal').textContent = `总数 ${total}`;

      document.getElementById('bottomHadir').textContent = hadir;
      document.getElementById('bottomTidakHadir').textContent = tidakHadir;
    }

    // 一键全勤
    document.getElementById('allPresentBtn').onclick = async () => {
      if (!confirm(`确认将全班 ${studentList.length} 名学生全部标记为出席 (Semua Hadir) 并提交归档？`)) return;
      
      studentList.forEach(s => {
        s.is_present = true;
        s.selectedReason = null;
      });
      renderGrid();
      updateCounters();

      await submitData([]);
    };

    // 底部提交
    document.getElementById('submitBtn').onclick = async () => {
      const absentList = studentList.filter(s => !s.is_present).map(s => ({
        idpelajar: s.id,
        namamurid: s.name,
        kategori: s.selectedReason ? s.selectedReason.kategori : 'D',
        sebab: s.selectedReason ? s.selectedReason.id_sebab_thadir : 'D0260001'
      }));

      const msg = absentList.length === 0 
        ? `确认提交全勤记录 (出席: ${studentList.length} 人)？`
        : `确认提交出勤记录 (缺席: ${absentList.length} 人，出席: ${studentList.length - absentList.length} 人)？`;

      if (!confirm(msg)) return;
      await submitData(absentList);
    };

    async function submitData(absentList) {
      document.getElementById('submitBtn').textContent = '正在提交...';
      document.getElementById('submitBtn').disabled = true;

      try {
        const res = await fetch('/api/submit', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            class_id: currentClass.id,
            date: getFormattedDate(),
            absent_list: absentList,
            verify: true
          })
        });
        const data = await res.json();
        if (data.success) {
          alert('出勤已成功提交并确认至教育部 MOEIS 系统！');
          loadAttendance();
        } else {
          alert('提交失败: ' + data.error);
        }
      } catch (e) {
        alert('提交异常: ' + e);
      } finally {
        document.getElementById('submitBtn').textContent = '确认提交并归档';
        document.getElementById('submitBtn').disabled = false;
      }
    }

    // 重置
    document.getElementById('resetBtn').onclick = async () => {
      if (!confirm('警告: 确认重置当天的出勤记录吗？')) return;
      try {
        const res = await fetch('/api/reset', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            class_id: currentClass.id,
            date: getFormattedDate()
          })
        });
        const data = await res.json();
        if (data.success) {
          alert('当日出勤已重置');
          loadAttendance();
        } else {
          alert('重置失败: ' + data.error);
        }
      } catch (e) {
        alert('重置异常: ' + e);
      }
    };

    document.getElementById('refreshBtn').onclick = loadAttendance;
    document.getElementById('datePicker').onchange = loadAttendance;

    // 启动初始化
    initApp();
  </script>
</body>
</html>
