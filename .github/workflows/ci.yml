name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-syntax:
    name: Python 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 字节码编译检查
        run: python -m compileall -q .

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装依赖
        working-directory: mobile-app
        run: npm install

      - name: 构建前端
        working-directory: mobile-app
        run: npx vite build

      - name: 静态检查
        working-directory: mobile-app
        run: npx eslint src
