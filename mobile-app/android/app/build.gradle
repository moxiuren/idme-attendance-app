apply plugin: 'com.android.application'

// ===== 签名配置 =====
// Android 只允许**同签名**覆盖安装，所以发布包必须始终用同一把钥匙。
//
// 当前钥匙：release/idme-release.keystore（2026-10-18 换新）
//   SHA-256: E6:47:BF:7A:...:3D   alias: idme-release   PKCS12  RSA 4096
//
// 为什么换：上一把 idme-rewrite.keystore 的口令从未落盘，无法签出任何包，
// 已改名为 idme-rewrite.keystore.old-unusable 留档（其签发的 v1.0.0
// 与当前钥匙不同源，已安装设备必须卸载重装）。
// 今后这把新钥匙的口令存于项目根 credentials-signing.json，**切勿丢失** ——
// 丢了就只能再换一次，代价同样是全体用户卸载重装。
//
// 口令不落库：keystore.properties 在 .gitignore 里，模板见 keystore.properties.example。
// 文件缺失时**不中断构建**（debug 构建、CI 前端构建仍需可用），
// 但会打印警告 —— 此时 assembleRelease 产出的是 unsigned APK，装不上。
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasSigning = false
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
    hasSigning = keystoreProps['storeFile'] && keystoreProps['storePassword']
            && keystoreProps['keyAlias'] && keystoreProps['keyPassword']
}
if (!hasSigning) {
    logger.warn("[签名] keystore.properties 缺失或口令为空 —— release 包将是 unsigned，无法覆盖安装。")
    logger.warn("[签名] 复制 android/keystore.properties.example 为 keystore.properties 并填入口令。")
}

android {
    namespace "my.gov.moe.idme.attendance"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "my.gov.moe.idme.attendance"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode 是「能否覆盖安装」的唯一判据：
        // 每次发布给老师前必须 +1，否则新 APK 装不上且系统只提示「应用未安装」。
        // versionName 只用于人眼识别，设置页底部显示的就是它（见 vite.config.js）。
        versionCode 4
        versionName "1.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasSigning) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                // v1 / v2 / v3 全开：v2 起才能防「换签名重打包」，
                // v3 支持密钥轮换，给将来留一条路。minSdk 24 全部支持。
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // 只有口令齐备时才挂签名配置 —— 否则 Gradle 会在配置阶段就报
            // 「storeFile is null」，连 debug 构建都跑不了。
            if (hasSigning) signingConfig signingConfigs.release
        }
        // 注：曾短暂加过 debug { applicationIdSuffix ".debug" }，用于「不卸载旧版
        // 也能装新版」的并存验证。已撤销 —— 用户明确同意卸载旧版，
        // 于是改用正式包名安装，让验证环境的包名、数据目录、
        // WebView 命名空间与最终发布版完全一致。
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
